<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose your treat</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pink-1: #ffe3ee;
    --pink-2: #ffb6d0;
    --pink-3: #f78fb3;
    --pink-4: #ffd1e3;
    --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--white);
    background: var(--pink-2);
    overflow: hidden;
    display: grid;
    place-items: center;
    position: relative;
  }

  /* Soft, slowly drifting pink blobs */
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden;
        background: linear-gradient(135deg, var(--pink-1), var(--pink-2) 55%, var(--pink-3)); }
  .blob {
    position: absolute; border-radius: 50%;
    filter: blur(70px); opacity: .75;
    animation: drift 18s ease-in-out infinite alternate;
  }
  .b1 { width: 45vmax; height: 45vmax; background: #ffd9e8; top: -12vmax; left: -10vmax; }
  .b2 { width: 40vmax; height: 40vmax; background: #ff8fb8; bottom: -14vmax; right: -8vmax; animation-delay: -6s; }
  .b3 { width: 30vmax; height: 30vmax; background: #ffc2da; top: 30%; left: 45%; animation-delay: -12s; }
  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(6vmax, -4vmax) scale(1.15); }
  }

  /* Floating sparkle dots (created by JS) */
  .dot {
    position: fixed; z-index: 1; border-radius: 50%;
    background: rgba(255,255,255,.7);
    pointer-events: none;
    animation: float linear infinite;
  }
  @keyframes float {
    from { transform: translateY(0); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    to   { transform: translateY(-110vh); opacity: 0; }
  }

  main { position: relative; z-index: 2; width: min(960px, 92vw); text-align: center; }

  h1 {
    font-size: clamp(2rem, 5vw, 3.4rem);
    font-weight: 600;
    margin-bottom: 2.5rem;
    text-shadow: 0 3px 18px rgba(200, 60, 110, .35);
  }

  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(1rem, 3vw, 2rem);
  }

  .option {
    display: flex; align-items: center; justify-content: center;
    min-height: clamp(180px, 34vh, 280px);
    padding: 1.5rem;
    color: var(--white);
    text-decoration: none;
    font: inherit;
    font-size: clamp(1.5rem, 3.4vw, 2.4rem);
    font-weight: 600;
    background: rgba(255, 255, 255, .22);
    border: 1.5px solid rgba(255, 255, 255, .65);
    border-radius: 28px;
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 10px 40px rgba(214, 70, 120, .25), inset 0 1px 0 rgba(255,255,255,.7);
    text-shadow: 0 2px 12px rgba(190, 50, 100, .4);
    cursor: pointer;
    transition: transform .35s cubic-bezier(.2,.8,.2,1), background .35s, box-shadow .35s;
  }
  .option:hover, .option:focus-visible {
    transform: translateY(-8px) scale(1.03);
    background: rgba(255, 255, 255, .36);
    box-shadow: 0 20px 55px rgba(214, 70, 120, .38), inset 0 1px 0 rgba(255,255,255,.9);
  }
  .option:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  .option:active { transform: scale(.98); }

  @media (max-width: 640px) {
    .options { grid-template-columns: 1fr; }
    .option { min-height: 140px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .blob, .dot { animation: none; }
    .option { transition: none; }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <main>
    <h1>What are you craving?</h1>
    <nav class="options" aria-label="Menu categories">
      <!-- Change these href values to your actual page filenames -->
      <a class="option" href="Sweets.html" id="sweets">Sweets</a>
      <a class="option" href="Shakes Smoothies.html" id="shakes">Shakes &amp; Smoothies</a>
    </nav>
  </main>

  <script>
    // Gentle floating sparkles in the background
    (function () {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      for (let i = 0; i < 22; i++) {
        const d = document.createElement("span");
        const size = 4 + Math.random() * 10;
        d.className = "dot";
        d.style.width = d.style.height = size + "px";
        d.style.left = Math.random() * 100 + "vw";
        d.style.top = 100 + Math.random() * 20 + "vh";
        d.style.animationDuration = 12 + Math.random() * 14 + "s";
        d.style.animationDelay = -Math.random() * 20 + "s";
        document.body.appendChild(d);
      }
    })();

    // Encode spaces/& safely when linking to local files
    document.querySelectorAll(".option").forEach(function (el) {
      el.setAttribute("href", encodeURI(el.getAttribute("href")).replace(/&/g, "%26"));
    });
  </script>
<script id="mmb-song">
/* Song for this page. Inside the Food Mood Mix player the player keeps the song going;
   if this page is opened on its own, it plays its own song from where the last page left off. */
(function () {
  if (window.parent !== window) return;
  var SONG = "audio/ishq-wala-love.m4a";
  var mt = /[#&]t=([\d.]+)/.exec(location.hash), mp = /[#&]p=([01])/.exec(location.hash);
  var start = mt ? parseFloat(mt[1]) : 0, want = mp ? mp[1] === "1" : true;
  var a = new Audio(); a.src = SONG; a.loop = true; a.preload = "auto";
  var seeked = false;
  function tryPlay() { var p = a.play(); if (p && p.catch) p.catch(function () {}); }
  a.addEventListener("loadedmetadata", function () {
    if (!seeked && start > 0 && isFinite(a.duration)) { a.currentTime = start % a.duration; }
    seeked = true;
    if (want) tryPlay();
  });
  a.addEventListener("ended", function () { a.currentTime = 0; if (want) tryPlay(); });
  /* browsers may block sound until the first tap: start on the first interaction */
  function firstTap() { if (want && a.paused) tryPlay(); }
  ["pointerdown", "keydown", "touchstart"].forEach(function (ev) { document.addEventListener(ev, firstTap, { once: true, passive: true }); });
  /* carry the song position to the next page */
  document.addEventListener("click", function (e) {
    var l = e.target.closest && e.target.closest("a[href]");
    if (!l) return;
    var h = l.getAttribute("href");
    if (!h || h.charAt(0) === "#" || /^[a-z]+:/i.test(h) && !/^file:/i.test(h)) return;
    l.href = l.href.split("#")[0] + "#t=" + a.currentTime.toFixed(2) + "&p=" + (want && !a.paused ? 1 : 0);
  }, true);
  /* pause / play button */
  var b = document.createElement("button");
  b.type = "button";
  b.style.cssText = "position:fixed;left:16px;bottom:16px;z-index:2147483647;display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(20,20,20,.6);color:#fff;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 6px 24px rgba(0,0,0,.35);cursor:pointer;padding:0";
  var PAUSE = '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>';
  var PLAY = '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  function paint() { var on = want && !a.paused; b.innerHTML = on ? PAUSE : PLAY; b.setAttribute("aria-label", on ? "Pause" : "Play"); }
  b.addEventListener("click", function (e) { e.stopPropagation(); if (want && !a.paused) { want = false; a.pause(); } else { want = true; tryPlay(); } paint(); });
  a.addEventListener("play", paint); a.addEventListener("pause", paint);
  document.body.appendChild(b); paint();
})();
</script>
</body>
</html>
