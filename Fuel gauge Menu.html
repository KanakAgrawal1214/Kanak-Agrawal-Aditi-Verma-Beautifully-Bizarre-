  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);-webkit-tap-highlight-color:transparent}
.page{position:fixed;inset:0;container-type:size;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto auto;justify-items:center;
  padding:3cqh 4cqw 3cqh;gap:1.6cqh;
  padding-top:max(3cqh,env(safe-area-inset-top,0px));padding-bottom:max(3cqh,env(safe-area-inset-bottom,0px))}

/* meter */
.meter{width:min(80cqw,56cqh);height:auto;overflow:visible;display:block}
.tick{stroke:#fff;stroke-linecap:round;stroke-width:1.1}
.tick.e{stroke:var(--empty)}
.glab{font:500 4.4px var(--sans);fill:#fff}
.needle{transition:transform .9s cubic-bezier(.3,1.4,.5,1)}

/* text */
.name{margin:0;text-align:center;font:600 min(6.4cqh,11cqw)/1.05 var(--serif);letter-spacing:.01em;text-wrap:balance;min-height:1.1em}
.desc{margin:0;text-align:center;font:300 clamp(14px,min(2.3cqh,4cqw),19px)/1.5 var(--sans);color:var(--soft);max-width:36ch;min-height:3em}
.swap{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(1.6cqh)}}

/* stage */
.row{width:min(100%,760px);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:2cqw;min-height:0}
.arrow{all:unset;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);cursor:pointer;font:400 24px/1 var(--sans);color:var(--ink);background:rgba(255,255,255,.06);backdrop-filter:blur(3px)}
.arrow:hover{background:var(--ink);color:#111}
.arrow:focus-visible,.dots button:focus-visible,.stage:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.stage{all:unset;position:relative;height:100%;min-height:0;cursor:zoom-in;display:block}
.stage:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:12px}
.it{position:absolute;inset:0;pointer-events:none;will-change:transform,opacity}
.it img{position:absolute;inset:3%;width:94%;height:94%;object-fit:contain;filter:drop-shadow(0 1.2cqh 2.4cqh rgba(0,0,0,.6));user-select:none}
.it.before{opacity:0;transform:translateX(22%) scale(.6) rotate(10deg);transition:none}
.it.active{opacity:1;transform:none;transition:transform .8s cubic-bezier(.2,1.1,.3,1),opacity .5s ease}
.it.leaving{opacity:0;transform:translateX(-22%) scale(.6) rotate(-10deg);transition:transform .6s cubic-bezier(.5,0,.8,.4),opacity .45s ease}

.dots{display:flex;gap:10px;align-items:center;padding-bottom:.4cqh}
.dots button{all:unset;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink);cursor:pointer;transition:width .3s,background .3s}
.dots button[aria-current="true"]{width:26px;border-radius:6px;background:var(--ink)}

/* tap hint */
.hint{margin:0;display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border:1.5px solid #fff;border-radius:999px;background:rgba(255,255,255,.08);backdrop-filter:blur(3px);color:var(--ink);font:500 clamp(13px,min(2cqh,3.6cqw),16px)/1.2 var(--sans);letter-spacing:.04em;cursor:pointer;animation:nudge 2.4s ease-in-out infinite}
.hint:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){.hint{animation:none}}

/* popup */
.modal{position:fixed;inset:0;display:none;place-items:center;padding:16px;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:10}
.modal.open{display:grid;animation:fade .25s ease both}
.card{--ink:#2a1535;--soft:#6a5274;color:var(--ink);position:relative;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:4vmin;width:min(900px,100%);max-height:100%;
  background:var(--plate);border:3px solid var(--rim);border-radius:28px;padding:4vmin;box-shadow:0 30px 80px rgba(42,21,53,.45);animation:pop .35s cubic-bezier(.2,1.1,.3,1) both}
.card .big{display:grid;place-items:center;min-height:0}
.card .big img{max-width:100%;max-height:min(62vh,560px);object-fit:contain;filter:drop-shadow(1.2vmin 2vmin 2vmin rgba(42,21,53,.3))}
.card .kind{font:400 14px/1 var(--sans);color:var(--soft);letter-spacing:.08em;margin:0 0 12px}
.card h2{margin:0 0 14px;font:600 clamp(32px,5.4vmin,54px)/1.02 var(--serif);text-wrap:balance}
.card .pdesc{margin:0;font:300 clamp(15px,2.2vmin,18px)/1.6 var(--sans);color:var(--soft);max-width:34ch}
.x{all:unset;position:absolute;top:14px;right:14px;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;cursor:pointer;color:var(--ink);border:1.5px solid var(--ink);font:400 22px/1 var(--sans);background:var(--plate)}
.x:hover{background:var(--ink);color:var(--plate)}
.x:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.82) translateY(3vh)}}
@media (max-width:640px){
  .arrow{width:38px;height:38px}
  .row{gap:6px}
  .card{grid-template-columns:1fr;text-align:center;padding:22px 20px 28px;overflow:auto}
  .card .pdesc{margin-inline:auto}
  .card .big img{max-height:38vh}
}
@media (prefers-reduced-motion:reduce){.modal.open,.card,.swap{animation:none}.needle,.it.active,.it.leaving{transition-duration:.01s}}
</style>
</head>

<main class="page">
  <svg class="meter" viewBox="-8 -4 116 66" aria-hidden="true">
    <defs><filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1"/></filter></defs>
    <g id="ticks"></g><g id="glabels"></g>
    <circle cx="48" cy="52.5" r="7.2" fill="#2a1535" opacity=".28" filter="url(#blur)"/>
    <circle cx="50" cy="50" r="6.6" fill="#f6f3f8" stroke="#b4c24c" stroke-width="1.5"/>
    <circle cx="50" cy="50" r="4.4" fill="none" stroke="#c9ccd6" stroke-width=".4"/>
    <g transform="translate(50 50)"><g class="needle" id="needle"><line x1="8.6" y1="0" x2="32" y2="0" stroke="#2fc47a" stroke-width="1.6" stroke-linecap="round"/></g></g>
  </svg>
  <h1 class="name" id="name"></h1>
  <div class="row">
    <button class="arrow" id="prev" aria-label="Previous dish">&lsaquo;</button>

    <button class="arrow" id="next" aria-label="Next dish">&rsaquo;</button>
  </div>
  <p class="desc" id="desc"></p>
  <button type="button" class="hint" id="hint">Tap on the item to see its price</button>
  <div class="dots" id="dots"></div>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">

  function pt(r,a){return [50+r*Math.cos(a*Math.PI/180),50-r*Math.sin(a*Math.PI/180)]}
  var g=$("ticks"),K=(N-1)*2;
  for(var k=0;k<=K;k++){
    var a=180-k*180/K,major=k%2===0,p1=pt(major?36:39,a),p2=pt(46,a);
    var l=document.createElementNS(NS,"line");
    l.setAttribute("x1",p1[0]);l.setAttribute("y1",p1[1]);l.setAttribute("x2",p2[0]);l.setAttribute("y2",p2[1]);
    l.setAttribute("class","tick");g.appendChild(l);
  }
  function aim(i){$("needle").style.transform="rotate("+(-(180-i*180/(N-1)))+"deg)"}

  /* dishes + dots */
  var stage=$("stage"),els=[],dots=[];
  data.forEach(function(d,i){
    var w=document.createElement("div");w.className="it before";
    var im=document.createElement("img");im.src=d.f;im.alt=d.n;im.draggable=false;
    w.appendChild(im);stage.appendChild(w);els.push(w);
    var b=document.createElement("button");b.type="button";b.setAttribute("aria-label",d.n);
    b.addEventListener("click",function(){go(i,true)});$("dots").appendChild(b);dots.push(b);
  });
  aim(0);

  function go(j,manual){
    var nxt=(j+N)%N,prev=cur;
    if(els[nxt].classList.contains("active"))return;
    els.forEach(function(e,k){if(k!==prev&&k!==nxt)e.className="it before"});
    els[prev].className="it leaving";
    els[nxt].className="it before";void els[nxt].offsetWidth;els[nxt].className="it active";
    cur=nxt;
    dots.forEach(function(b,k){b.setAttribute("aria-current",k===cur?"true":"false")});
    aim(cur);
    $("name").textContent=data[cur].n;$("desc").textContent=data[cur].d;
    ["name","desc"].forEach(function(id){var e=$(id);e.classList.remove("swap");void e.offsetWidth;e.classList.add("swap")});
    if(manual)restart();
  }
  function stop(){}
  function start(){}
  function restart(){}

  $("prev").addEventListener("click",function(){go(cur-1,true)});
  $("next").addEventListener("click",function(){go(cur+1,true)});

  /* popup */
  function fill(){var d=data[cur];$("mImg").src=d.f;$("mImg").alt=d.n;$("mKind").textContent=d.t;$("mTitle").textContent=d.n;$("mDesc").textContent=d.d}
  function openM(){fill();$("modal").classList.add("open");stop();$("close").focus()}
  function closeM(){$("modal").classList.remove("open");start();stage.focus()}
  stage.addEventListener("click",openM);
  $("hint").addEventListener("click",openM);
  $("close").addEventListener("click",closeM);
  $("modal").addEventListener("click",function(e){if(e.target===this)closeM()});
  document.addEventListener("keydown",function(e){
    if($("modal").classList.contains("open")){if(e.key==="Escape")closeM();return}
    if(e.key==="ArrowRight")go(cur+1,true);else if(e.key==="ArrowLeft")go(cur-1,true);
  });

  /* first dish settles in, then autoplay */
  requestAnimationFrame(function(){
    els[0].className="it active";cur=0;
    dots[0].setAttribute("aria-current","true");
    $("name").textContent=data[0].n;$("desc").textContent=data[0].d;
    start();
  });
})();
</script>
<script id="mmb-song">
/* Song for this page. Inside the Food Mood Mix player the player keeps the song going;
   if this page is opened on its own, it plays its own song from where the last page left off. */
(function () {
  if (window.parent !== window) return;
  var SONG = "audio/idgaf.m4a";
  var mt = /[#&]t=([\d.]+)/.exec(location.hash), mp = /[#&]p=([01])/.exec(location.hash);
  var start = mt ? parseFloat(mt[1]) : 0, want = mp ? mp[1] === "1" : true;
  var a = new Audio(); a.src = SONG; a.loop = true; a.preload = "auto";
  var seeked = false;
  function tryPlay() { var p = a.play(); if (p && p.catch) p.catch(function () {}); }
  a.addEventListener("loadedmetadata", function () {
    if (!seeked && start > 0 && isFinite(a.duration)) { a.currentTime = start % a.duration; }
    seeked = true;
    if (want) tryPlay();
  });
  a.addEventListener("ended", function () { a.currentTime = 0; if (want) tryPlay(); });
  /* browsers may block sound until the first tap: start on the first interaction */
  function firstTap() { if (want && a.paused) tryPlay(); }
  ["pointerdown", "keydown", "touchstart"].forEach(function (ev) { document.addEventListener(ev, firstTap, { once: true, passive: true }); });
  /* carry the song position to the next page */
  document.addEventListener("click", function (e) {
    var l = e.target.closest && e.target.closest("a[href]");
    if (!l) return;
    var h = l.getAttribute("href");
    if (!h || h.charAt(0) === "#" || /^[a-z]+:/i.test(h) && !/^file:/i.test(h)) return;
    l.href = l.href.split("#")[0] + "#t=" + a.currentTime.toFixed(2) + "&p=" + (want && !a.paused ? 1 : 0);
  }, true);
  /* pause / play button */
  var b = document.createElement("button");
  b.type = "button";
  b.style.cssText = "position:fixed;left:16px;bottom:16px;z-index:2147483647;display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(20,20,20,.6);color:#fff;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 6px 24px rgba(0,0,0,.35);cursor:pointer;padding:0";
  var PAUSE = '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>';
  var PLAY = '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  function paint() { var on = want && !a.paused; b.innerHTML = on ? PAUSE : PLAY; b.setAttribute("aria-label", on ? "Pause" : "Play"); }
  b.addEventListener("click", function (e) { e.stopPropagation(); if (want && !a.paused) { want = false; a.pause(); } else { want = true; tryPlay(); } paint(); });
  a.addEventListener("play", paint); a.addEventListener("pause", paint);
  document.body.appendChild(b); paint();
})();
</script>
