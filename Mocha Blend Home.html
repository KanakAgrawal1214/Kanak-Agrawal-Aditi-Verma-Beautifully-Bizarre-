.bg::after{content:"";position:absolute;inset:-8%;pointer-events:none;background:radial-gradient(ellipse at 22% 18%,rgba(255,205,125,.20),transparent 34%),radial-gradient(ellipse at 82% 32%,rgba(255,174,83,.13),transparent 30%),radial-gradient(ellipse at 50% 100%,rgba(201,164,106,.12),transparent 42%);mix-blend-mode:screen;animation:ambientGlow 8s ease-in-out infinite alternate}
@keyframes ambientGlow{from{opacity:.55;filter:blur(0)}to{opacity:.95;filter:blur(2px)}}
.frame{position:absolute;inset:22px;border:1px solid rgba(201,164,106,.45);pointer-events:none}
.frame::before,.frame::after{content:"";position:absolute;width:9px;height:9px;background:var(--gold);transform:rotate(45deg);left:50%;margin-left:-4px}
.frame::before{top:-5px}.frame::after{bottom:-5px}

/* Mocha Blend logo */
.logo{display:flex;flex-direction:column;align-items:center;text-align:center}
.logo svg{width:84px;height:84px;display:block}
.logo h1{margin:.2em 0 0;font-weight:500;font-size:clamp(2.6rem,6.2vw,5.2rem);letter-spacing:.14em;line-height:1;text-transform:none;padding-left:.14em}
.logo .tag{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1rem,1.5vw,1.25rem);color:var(--gold2);letter-spacing:.08em;margin-top:.5em}
.rule{display:flex;align-items:center;gap:12px;color:var(--gold);margin:2.4vh 0}
.rule::before,.rule::after{content:"";width:70px;height:1px;background:currentColor;opacity:.7}
.rule i{width:6px;height:6px;background:currentColor;transform:rotate(45deg)}

/* landing */
.home{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 8vw;text-align:center;animation:in 1.2s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.copy{max-width:36rem;font-size:clamp(1rem,1.5vw,1.25rem);line-height:1.8;margin:0 0 4vh;color:#ecdfc6;font-weight:300}
.btn{font-family:'Jost',sans-serif;font-weight:400;letter-spacing:.08em;font-size:1rem;color:var(--esp);background:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:1em 2.8em;cursor:pointer;transition:background .25s,color .25s}
.btn:hover{background:transparent;color:var(--gold2)}
.cta{display:flex;flex-direction:column;align-items:center;gap:1.2vh}
.click{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.3rem;color:var(--gold2);letter-spacing:.06em;display:flex;flex-direction:column;align-items:center;gap:2px}
.click svg{width:18px;height:18px;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
.btn:focus-visible,.mood:focus-visible,.link:focus-visible{outline:2px solid var(--cream);outline-offset:4px}
.link{color:var(--gold2);background:none;border:0;border-bottom:1px solid rgba(226,196,143,.5);padding:0 0 2px;font:inherit;font-size:.95rem;letter-spacing:.06em;cursor:pointer}

@media (max-width:820px),(max-height:560px){body{overflow:auto}.screen{position:absolute;min-height:100%}.home{min-height:100vh;padding-top:8vh;padding-bottom:8vh}}
@media (prefers-reduced-motion:reduce){.home,.click svg{animation:none}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="emb" viewBox="0 0 100 100"><g fill="none" stroke="#c9a46a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="50" r="46"/><circle cx="50" cy="50" r="41" stroke-width=".8"/><path d="M30 55h36v6a14 14 0 0 1-14 14h-8a14 14 0 0 1-14-14z"/><path d="M66 57h4a6 6 0 0 1 0 12h-5"/><path d="M38 28v18M44 22v24M50 30v16M56 24v22M62 32v14" stroke="#e2c48f"/></g></symbol>
</defs></svg>

<section class="screen on" id="home" aria-label="Mocha Blend">
  <div class="bg"></div><div class="frame"></div>
  <div class="home">
    <div class="logo" role="img" aria-label="Mocha Blend logo">
      <svg aria-hidden="true"><use href="#emb"/></svg>
      <h1>Mocha Blend</h1>
      <div class="tag">your mood, your menu</div>
    </div>
    <div class="rule" aria-hidden="true"><i></i></div>
    <p class="copy">Ever heard of Spotify Blend? Introducing you to Mocha blend. Wanna have your own customized menu according to your mood?</p>
    <div class="cta"><span class="click">Click here<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span><button class="btn" id="go">Pick my mood</button></div>
  </div>
</section>

<script id="mmb-song">
/* Pick my mood -> Food Mood Mix. Song "Front" plays here.
   Inside the Mocha Blend player the player owns the audio so it never restarts between pages. */
(function () {
  var EMB = window.parent !== window;
  var go = document.getElementById("go");
  function send(t) { window.parent.postMessage({ type: t }, "*"); }
  go.addEventListener("click", function () {
    if (EMB) send("enter"); else window.location.href = "Food Mood Mix.html";
  });
  if (EMB) {
    send("home");
    window.addEventListener("pageshow", function (e) { if (e.persisted) send("home"); });
    ["pointerdown", "keydown", "touchstart"].forEach(function (ev) {
      document.addEventListener(ev, function () { send("tap"); }, { passive: true });
    });
    return;
  }
  /* opened on its own: play Front from this page */
  var a = new Audio("audio/front.mp3"); a.loop = true; a.preload = "auto";
  var want = true;
  function tryPlay() { var p = a.play(); if (p && p.catch) p.catch(function () {}); }
  a.addEventListener("ended", function () { a.currentTime = 0; if (want) tryPlay(); });
  tryPlay();
  ["pointerdown", "keydown", "touchstart"].forEach(function (ev) {
    document.addEventListener(ev, function () { if (want && a.paused) tryPlay(); }, { once: true, passive: true });
  });
  var b = document.createElement("button");
  b.type = "button";
  b.style.cssText = "position:fixed;left:16px;bottom:16px;z-index:2147483647;display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(20,20,20,.6);color:#fff;cursor:pointer;padding:0";
  var PAUSE = '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>';
  var PLAY = '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  function paint() { var on = want && !a.paused; b.innerHTML = on ? PAUSE : PLAY; b.setAttribute("aria-label", on ? "Pause" : "Play"); }
  b.addEventListener("click", function (e) { e.stopPropagation(); if (want && !a.paused) { want = false; a.pause(); } else { want = true; tryPlay(); } paint(); });
  a.addEventListener("play", paint); a.addEventListener("pause", paint);
  document.body.appendChild(b); paint();
})();
</script>
</body>
</html>
